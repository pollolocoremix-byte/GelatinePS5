name: "Build EglantinePS5"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o etiqueta del repositorio original a compilar"
        default: "main"
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      EGLANTINEPS5_DEPS_CACHE: ${{ github.workspace }}/../.deps-cache
    steps:
      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Descargar la ultima version del repositorio original
        uses: actions/checkout@v4
        with:
          repository: heydemoura/EglantinePS5
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Mostrar que version se compila
        run: git log -1 --format='Commit %h del %cd - %s'

      - name: Restaurar cache de dependencias
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../.deps-cache
          key: deps-${{ hashFiles('tools/deps.json') }}
          restore-keys: deps-

      - name: Restaurar cache de ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Restaurar cache del traductor SPIR-V
        uses: actions/cache/restore@v4
        with:
          path: ~/spirv-llvm-translator
          key: spirv-${{ hashFiles('tools/ci/setup-ubuntu-24.04.sh') }}
          restore-keys: spirv-

      - name: Instalar herramientas de compilacion
        run: bash tools/ci/setup-ubuntu-24.04.sh "$HOME/spirv-llvm-translator"

      - name: Guardar cache del traductor SPIR-V
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/spirv-llvm-translator
          key: spirv-${{ hashFiles('tools/ci/setup-ubuntu-24.04.sh') }}-${{ github.run_id }}

      - name: Compilar
        run: |
          SPIRV_DIR="$HOME/spirv-llvm-translator"
          PC=$(find "$SPIRV_DIR" -name LLVMSPIRVLib.pc | head -n1)
          echo "Archivo pkg-config encontrado: $PC"
          if [ -z "$PC" ]; then
            echo "No se encontro LLVMSPIRVLib.pc. Contenido de la carpeta:"
            find "$SPIRV_DIR" -maxdepth 4 | head -60
            exit 1
          fi
          LIBSO=$(find "$SPIRV_DIR" -name 'libLLVMSPIRVLib.so*' | head -n1)
          export PKG_CONFIG_PATH="$(dirname "$PC"):$PKG_CONFIG_PATH"
          export CMAKE_PREFIX_PATH="$SPIRV_DIR:$CMAKE_PREFIX_PATH"
          if [ -n "$LIBSO" ]; then export LD_LIBRARY_PATH="$(dirname "$LIBSO"):$LD_LIBRARY_PATH"; fi
          export JOBS=$(nproc)
          export RADV_BUILD_JOBS=$(nproc)
          bash tools/ci/build-release.sh

      - name: Guardar cache de dependencias
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../.deps-cache
          key: deps-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}

      - name: Guardar cache de ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ github.run_id }}

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: EglantinePS5
          path: dist/
          retention-days: 30
