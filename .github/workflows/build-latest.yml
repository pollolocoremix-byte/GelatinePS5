name: "Build EglantinePS5"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o etiqueta del repositorio original a compilar"
        default: "main"
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      EGLANTINEPS5_DEPS_CACHE: ${{ github.workspace }}/../.deps-cache
    steps:
      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Descargar la ultima version del repositorio original
        uses: actions/checkout@v4
        with:
          repository: heydemoura/EglantinePS5
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Mostrar que version se compila
        run: git log -1 --format='Commit %h del %cd - %s'

      - name: Restaurar cache de dependencias
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../.deps-cache
          key: deps-${{ hashFiles('tools/deps.json') }}
          restore-keys: deps-

      - name: Restaurar cache de ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Instalar herramientas de compilacion
        run: bash tools/ci/setup-ubuntu-24.04.sh

      - name: Compilar
        run: |
          export JOBS=$(nproc)
          export RADV_BUILD_JOBS=$(nproc)
          bash tools/ci/build-release.sh

      - name: Guardar cache de dependencias
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../.deps-cache
          key: deps-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}

      - name: Guardar cache de ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ github.run_id }}

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: EglantinePS5
          path: dist/
          retention-days: 30
